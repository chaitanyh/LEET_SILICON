name: OpenROAD Place-and-Route — soc_top Sky130A

on:
  workflow_dispatch:
  push:
    paths:
      - "OPEN_SOC_FLOW/gls/netlist/soc_top_sky130.v"
      - "OPEN_SOC_FLOW/constraints/soc_top.sdc"
      - "OPEN_SOC_FLOW/openroad/**"
      - ".github/workflows/openroad_par.yml"

jobs:
  par:
    name: P&R — Sky130A | soc_top (PicoRV32 SoC)
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      PDK_VER: "bdc9412b3e468c102d01b7cf6337be06ec6e9c9a"
      PDK_ROOT: "${{ github.workspace }}/pdk"
      DESIGN:   "OPEN_SOC_FLOW"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install OpenROAD binary (Precision-Innovations pre-built .deb) ─────────
      - name: Install OpenROAD
        run: |
          sudo apt-get update -qq
          wget https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -O /tmp/openroad.deb
          sudo apt-get install -y --fix-missing /tmp/openroad.deb
          openroad -version

      # ── Install Python + volare (PDK manager) ─────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sky130A PDK via volare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install volare
          volare enable --pdk sky130 "$PDK_VER" --pdk-root "$PDK_ROOT"
          echo "=== PDK lib files ==="
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/lib/" | head -5
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/lef/"
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/techlef/"

      # ── Verify design inputs ───────────────────────────────────────────────────
      - name: Verify design inputs
        working-directory: ${{ env.DESIGN }}
        run: |
          echo "=== Netlist (first 5 lines) ==="
          head -5 gls/netlist/soc_top_sky130.v
          echo "Total cells: $(grep -c sky130_fd_sc_hd gls/netlist/soc_top_sky130.v)"
          echo "=== SDC ==="
          cat constraints/soc_top.sdc
          mkdir -p physical reports/timing reports/routing reports/synthesis reports/pv gds

      # ── Stage 1: Floorplan ─────────────────────────────────────────────────────
      - name: "Stage 1/4 — Floorplan"
        working-directory: ${{ env.DESIGN }}
        run: |
          openroad -exit openroad/floorplan/floorplan.tcl 2>&1 | tee reports/synthesis/floorplan.log
          ls -lh physical/floorplan.def

      # ── Stage 2: Placement ─────────────────────────────────────────────────────
      - name: "Stage 2/4 — Placement"
        working-directory: ${{ env.DESIGN }}
        run: |
          openroad -exit openroad/placement/placement.tcl 2>&1 | tee reports/synthesis/placement.log
          ls -lh physical/placed.def

      # ── Stage 3: CTS ───────────────────────────────────────────────────────────
      - name: "Stage 3/4 — Clock Tree Synthesis"
        working-directory: ${{ env.DESIGN }}
        run: |
          openroad -exit openroad/cts/cts.tcl 2>&1 | tee reports/synthesis/cts.log
          ls -lh physical/cts.def

      # ── Stage 4: Routing + SPEF ────────────────────────────────────────────────
      - name: "Stage 4/4 — Routing + SPEF Extraction"
        working-directory: ${{ env.DESIGN }}
        timeout-minutes: 120
        run: |
          openroad -exit openroad/routing/routing.tcl 2>&1 | tee reports/routing/routing.log
          ls -lh physical/routed.def
          ls -lh physical/soc_top.spef 2>/dev/null || echo "NOTE: SPEF not written — check OpenRCX rule path"

      # ── STA signoff ────────────────────────────────────────────────────────────
      - name: "STA Signoff — TT/FF/SS with SPEF"
        working-directory: ${{ env.DESIGN }}
        run: |
          openroad -exit openroad/sta/sta_signoff.tcl 2>&1 | tee reports/timing/sta_signoff.log

      # ── Print timing summary ───────────────────────────────────────────────────
      - name: Print timing results
        working-directory: ${{ env.DESIGN }}
        if: always()
        run: |
          {
            echo "## Timing Signoff"
            echo '```'
            cat reports/timing/sta_signoff_summary.rpt 2>/dev/null \
              || grep -A5 "SIGNOFF\|PASS\|FAIL\|WNS\|TNS" reports/timing/sta_signoff.log 2>/dev/null \
              || echo "(no summary yet)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "=== TIMING SUMMARY ==="
          cat reports/timing/sta_signoff_summary.rpt 2>/dev/null || true

      # ── GDS export ─────────────────────────────────────────────────────────────
      # Install full KLayout (system package) for LEF/DEF → GDS conversion.
      # pip install klayout provides only the Python db module (no CLI binary);
      # the CLI binary is required to use pya (full application context) for LEF/DEF import.
      - name: "GDS Export"
        working-directory: ${{ env.DESIGN }}
        if: success()
        run: |
          # Install full KLayout system package (provides `klayout` binary + pya)
          sudo apt-get update -qq
          sudo apt-get install -y klayout || echo "WARNING: klayout apt install failed"
          klayout -v || echo "klayout binary not available"
          pip install klayout
          python3 physical_verification/klayout/generate_gds.py \
            --def     physical/routed.def \
            --lef     "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/lef/sky130_fd_sc_hd.lef" \
            --techlef "$PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/techlef/sky130_fd_sc_hd__nom.tlef" \
            --gds     gds/soc_top.gds 2>&1 | tee gds/generate_gds.log || true
          ls -lh gds/

      # ── DRC ────────────────────────────────────────────────────────────────────
      - name: "DRC — KLayout Sky130A"
        working-directory: ${{ env.DESIGN }}
        if: success()
        run: |
          python3 physical_verification/klayout/run_drc_sky130.py \
            --gds gds/soc_top.gds \
            --rpt reports/pv/klayout_drc.xml 2>&1 | tee reports/pv/drc.log || true

      # ── Upload all artifacts ───────────────────────────────────────────────────
      - name: Upload P&R results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: par-results-${{ github.run_number }}
          retention-days: 30
          path: |
            OPEN_SOC_FLOW/physical/
            OPEN_SOC_FLOW/gds/
            OPEN_SOC_FLOW/gls/netlist/soc_top_routed.v
            OPEN_SOC_FLOW/gls/netlist/soc_top_cts.v
            OPEN_SOC_FLOW/reports/

      - name: Upload DEF checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: def-checkpoints-${{ github.run_number }}
          retention-days: 30
          path: |
            OPEN_SOC_FLOW/physical/*.def
            OPEN_SOC_FLOW/physical/*.spef
            OPEN_SOC_FLOW/physical/*.guide
